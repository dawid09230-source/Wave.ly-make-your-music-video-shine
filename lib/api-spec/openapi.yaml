openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Musical.ly-style social video platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: videos
    description: Video feed and interactions
  - name: users
    description: User profiles
  - name: comments
    description: Video comments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List videos for feed
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a new video post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a single video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/{id}/like:
    post:
      operationId: likeVideo
      tags: [videos]
      summary: Like or unlike a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/trending:
    get:
      operationId: getTrendingVideos
      tags: [videos]
      summary: Get trending/discover videos
      responses:
        "200":
          description: Trending videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /videos/stats:
    get:
      operationId: getVideoStats
      tags: [videos]
      summary: Platform-wide stats for dashboard
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoStats"

  /videos/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments on a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Post a comment on a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List/search users
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow or unfollow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, username, displayName, followerCount, followingCount, likeCount, videoCount]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        followerCount:
          type: integer
        followingCount:
          type: integer
        likeCount:
          type: integer
        videoCount:
          type: integer
        isFollowing:
          type: boolean

    Video:
      type: object
      required: [id, userId, user, title, songName, songArtist, likeCount, commentCount, shareCount, viewCount, videoUrl, thumbnailUrl, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        title:
          type: string
        songName:
          type: string
        songArtist:
          type: string
        likeCount:
          type: integer
        commentCount:
          type: integer
        shareCount:
          type: integer
        viewCount:
          type: integer
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        isLiked:
          type: boolean
        hashtags:
          type: array
          items:
            type: string
        createdAt:
          type: string

    VideoInput:
      type: object
      required: [userId, title, songName, songArtist, videoUrl, thumbnailUrl]
      properties:
        userId:
          type: integer
        title:
          type: string
        songName:
          type: string
        songArtist:
          type: string
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        hashtags:
          type: array
          items:
            type: string

    VideoStats:
      type: object
      required: [totalVideos, totalLikes, totalUsers, totalViews]
      properties:
        totalVideos:
          type: integer
        totalLikes:
          type: integer
        totalUsers:
          type: integer
        totalViews:
          type: integer
        trendingHashtags:
          type: array
          items:
            type: string

    Comment:
      type: object
      required: [id, videoId, userId, user, text, likeCount, createdAt]
      properties:
        id:
          type: integer
        videoId:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        text:
          type: string
        likeCount:
          type: integer
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [userId, text]
      properties:
        userId:
          type: integer
        text:
          type: string
